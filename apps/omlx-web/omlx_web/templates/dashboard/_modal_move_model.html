<!-- Move Model Modal: pick a destination model dir by path + free space, -->
<!-- with the transfer progress and errors shown in place. -->
<dialog x-effect="hfMoveDialog ? $el.showModal() : $el.close()" x-cloak
     class="dashboard-dialog fixed inset-0 z-50 overflow-y-auto"
     role="dialog" aria-modal="true" aria-labelledby="move-model-modal-title"
     @keydown.tab="trapDialogFocus($event)"
     @cancel.prevent="closeMoveDialog()">
    <div class="fixed inset-0 bg-black/50" @click="closeMoveDialog()"></div>
    <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-[30rem] overflow-hidden"
             @click.stop>
            <div class="flex items-center justify-between px-6 py-4 border-b border-neutral-200">
                <h4 id="move-model-modal-title" tabindex="-1" autofocus
                    class="text-base font-bold tracking-tight text-neutral-900 truncate pr-2"
                    x-text="moveActiveRow() ? window.t('models.manager.move_in_progress') : window.t('models.manager.move_title')"></h4>
                <button @click="closeMoveDialog()"
                        class="p-1.5 text-neutral-400 hover:text-neutral-600 hover:bg-neutral-100 rounded-lg transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="px-6 py-5">
                <!-- Model summary -->
                <div class="flex items-center gap-2 mb-4 min-w-0">
                    <span class="text-sm font-semibold text-neutral-900 truncate"
                          x-text="hfMoveModel ? (hfMoveModel.display_name || hfMoveModel.name) : ''"></span>
                    <span x-show="hfMoveModel && hfMoveModel.size_formatted"
                          class="badge bg-neutral-100 text-neutral-500 border-neutral-200 flex-shrink-0"
                          x-text="hfMoveModel && hfMoveModel.size_formatted"></span>
                </div>
                <p class="text-xs font-medium text-neutral-500 uppercase tracking-wider mb-2"
                   x-text="window.t('models.manager.move_dir_hint')"></p>
                <!-- Destination choices -->
                <div class="space-y-2 mb-4">
                    <template x-for="d in moveDirRows" :key="d.path">
                        <button type="button"
                                @click="d.exists && d.path !== moveSourceDirPath() && (hfMoveDest = d.path)"
                                :disabled="!d.exists || d.path === moveSourceDirPath()"
                                class="w-full text-left rounded-xl border px-4 py-3 transition-all flex items-center gap-3"
                                :class="d.path === moveSourceDirPath()
                                    ? 'border-neutral-200 bg-neutral-50 opacity-60 cursor-not-allowed'
                                    : (d.exists
                                        ? (hfMoveDest === d.path ? 'border-neutral-900 bg-white ring-2 ring-neutral-900' : 'border-neutral-200 bg-white hover:border-neutral-400')
                                        : 'border-red-200 bg-red-50 opacity-70 cursor-not-allowed')">
                            <i data-lucide="hard-drive" class="w-4 h-4 text-neutral-400 flex-shrink-0"></i>
                            <span class="min-w-0 flex-1">
                                <span class="block text-xs font-mono text-neutral-800 truncate" x-text="d.path"></span>
                                <span class="mt-1 flex items-center gap-2 text-caption text-neutral-400">
                                    <span x-show="d.index === 0" class="text-neutral-500"
                                          x-text="window.t('models.manager.dir_primary')"></span>
                                    <span x-show="d.exists"
                                          x-text="window.t('models.manager.move_free').replace('{size}', formatFileSize(d.free_bytes))"></span>
                                    <span x-show="!d.exists" class="text-red-600"
                                          x-text="window.t('models.manager.move_not_mounted')"></span>
                                </span>
                            </span>
                            <span x-show="d.path === moveSourceDirPath()"
                                  class="badge bg-neutral-100 text-neutral-500 border-neutral-200 flex-shrink-0"
                                  x-text="window.t('models.manager.move_current_tag')"></span>
                            <span x-show="d.path !== moveSourceDirPath() && d.exists && moveSizeBytes() && d.free_bytes < moveSizeBytes()"
                                  class="badge bg-amber-50 text-amber-700 border-amber-200 flex-shrink-0"
                                  x-text="window.t('models.manager.move_space_warn')"></span>
                        </button>
                    </template>
                </div>
                <!-- Live transfer progress -->
                <template x-if="moveActiveRow() && ['starting','copying','finalizing'].includes(moveActiveRow().status)">
                    <div class="mb-4">
                        <div class="h-2 rounded-full bg-neutral-100 overflow-hidden">
                            <div class="h-full bg-neutral-900 transition-all duration-300"
                                 :style="`width: ${movePercent()}%`"></div>
                        </div>
                        <p class="mt-2 text-xs text-neutral-500" x-text="moveLabel(moveActiveRow())"></p>
                    </div>
                </template>
                <template x-if="moveActiveRow() && moveActiveRow().status === 'done'">
                    <div class="mb-4 px-4 py-2.5 bg-green-50 border border-green-200 text-green-700 text-sm rounded-xl flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
                        <span x-text="window.t('models.manager.move_done_note')"></span>
                    </div>
                </template>
                <div x-show="hfMoveError" x-cloak
                     class="mb-4 px-4 py-2.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                    <span x-text="hfMoveError"></span>
                </div>
            </div>
            <div class="flex items-center justify-end gap-2 px-6 py-4 bg-neutral-50 border-t border-neutral-200">
                <button @click="closeMoveDialog()"
                        class="px-4 py-2 text-sm font-medium text-neutral-600 hover:bg-neutral-100 rounded-full transition-all"
                        x-text="moveActiveRow() && moveActiveRow().status === 'done' ? window.t('models.manager.move_close') : window.t('models.detail.cancel')"></button>
                <template x-if="!moveActiveRow()">
                    <button @click="moveHFModel(hfMoveName)" :disabled="!hfMoveDest"
                            class="px-5 py-2 bg-neutral-900 text-white text-sm font-semibold rounded-full
                                   hover:bg-neutral-800 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            x-text="window.t('models.manager.move_yes')"></button>
                </template>
            </div>
        </div>
    </div>
</dialog>
